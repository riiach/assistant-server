spring:
  application:
    name: assistant-server
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

gemini:
  api:
    key: ${GEMINI_API_KEY}
    url: https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent

slack:
  bot:
    token: ${SLACK_BOT_TOKEN:xoxo-test}
  default-channel: ${SLACK_DEFAULT_CHANNEL:}

google:
  calendar:
    enabled: ${GOOGLE_CALENDAR_ENABLED:false}
    id: ${GOOGLE_CALENDAR_ID:primary}
    client-email: ${GOOGLE_CLIENT_EMAIL:}
    private-key: ${GOOGLE_PRIVATE_KEY:}
    project-id: ${GOOGLE_PROJECT_ID:assistant-server}
